name: Laravel tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP 8.4 / SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, curl, zip
          coverage: none
          tools: composer:v2

      - name: Check deployment script syntax
        run: bash -n scripts/hostinger-deploy.sh

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Configure application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install front-end dependencies
        run: npm ci

      - name: Compile Vite assets
        run: npm run build

      - name: Validate OpenAPI JSON and schema references
        run: python3 scripts/validate_openapi.py

      - name: Run automated tests (including route-contract parity)
        run: php artisan test
